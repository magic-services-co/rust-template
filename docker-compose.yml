# Coolify: create a project from this compose file, set SITE_URL to the public
# https URL, and set DB_PASSWORD / DB_ROOT_PASSWORD before you expose the site.
# MariaDB stays on the internal network. The site listens on port 3000.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PUBLISH_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      RUST_TEMPLATE_CONTAINER: "1"
      SITE_URL: ${SITE_URL:-}
      APP_KEY: ${APP_KEY:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-templatephp}
      DB_USERNAME: ${DB_USERNAME:-template}
      DB_PASSWORD: ${DB_PASSWORD:-template}
      NEXT_PUBLIC_LEADERBOARD_FAKE_DATA: ${NEXT_PUBLIC_LEADERBOARD_FAKE_DATA:-false}
    volumes:
      - app_storage:/var/www/rust-template/backend/storage
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-templatephp}
      MARIADB_USER: ${DB_USERNAME:-template}
      MARIADB_PASSWORD: ${DB_PASSWORD:-template}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-template-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  app_storage:
  db_data:
